<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preload" as="image" href="/images/cork-seamless.webp" fetchpriority="high">
  <link rel="stylesheet" href="/loading.css">
  <link rel="preload" as="image" href="/images/isobel-bartels-logo.webp" fetchpriority="high">
  <script src="/loading-logo.js" defer></script>
  <script src="/cork-background.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore Isobel Bartels’s creative portfolio of nail art, fashion styling, and handmade paper collages.">
  <meta property="og:description" content="Explore Isobel Bartels’s creative portfolio of nail art, fashion styling, and handmade paper collages.">
  <meta property="og:url" content="https://isobelbartels.com/art/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://isobelbartels.com/images/isobel-bartels-cutout.png">
  <meta property="og:image:alt" content="Isobel Bartels collage logo">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:description" content="Explore Isobel Bartels’s creative portfolio of nail art, fashion styling, and handmade paper collages.">
  <meta name="twitter:image" content="https://isobelbartels.com/images/isobel-bartels-cutout.png">
  <meta name="theme-color" content="#e5dcf5">
  <title>Isobel Bartels</title>
  <link rel="canonical" href="https://isobelbartels.com/art/">
  <meta property="og:title" content="Isobel Bartels">
  <meta property="og:site_name" content="Isobel Bartels">
  <meta name="twitter:title" content="Isobel Bartels">
  <meta name="application-name" content="Isobel Bartels">
  <meta name="apple-mobile-web-app-title" content="Isobel Bartels">
  <meta name="robots" content="max-image-preview:large">

  <style>

    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 24px 72px; min-height: 100vh; font-family: 'Times New Roman', Times, serif; color: #35271f; background: #c9a173 var(--cork-texture, url('/images/cork-seamless.webp')) repeat; background-size: 640px auto; }
    main { max-width: 1100px; margin: auto; }
    .back-link { color: #fffaf0; text-shadow: 0 1px 4px #000b; font-size: 15px; }
    h1 { color: #fffaf0; text-shadow: 0 2px 7px #0008; text-align: center; font-size: clamp(32px, 5vw, 44px); font-weight: normal; margin: 30px 0 52px; }
    a:focus-visible, button:focus-visible { outline: 3px solid #633650; outline-offset: 8px; }
    @media (max-width: 550px) { body { padding: 20px 24px 50px; } }

    .sections { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 42px; align-items: center; padding: 10px 6px 30px; }
    .section-frame { position: relative; display: block; padding: 26px; color: #35271f; text-decoration: none; aspect-ratio: 3 / 4; filter: drop-shadow(3px 9px 7px #42281166); transition: transform .18s ease; }
    .section-frame:hover { transform: translateY(-6px) rotate(0); }
    .frame-nails { background: #d6aa72 url('/images/frame-leopard.svg') repeat; background-size: 100px 100px; border: 2px solid #513422; border-radius: 20px; transform: rotate(-3deg); }
    .frame-styling { background: #fff8e8 url('/images/frame-zebra.svg') repeat; background-size: 100px 100px; border: 3px solid #29252c; border-radius: 4px; transform: rotate(2deg); }
    .frame-collages { background: url('/images/frame-scallop.svg') center / 100% 100% no-repeat; transform: rotate(-2deg); padding: 30px; }
    .frame-mat { height: 100%; background: #fffaf0; padding: 14px; box-shadow: 0 0 0 2px #0003, inset 0 2px 5px #0002; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .frame-mat img { width: 100%; min-height: 0; flex: 1; object-fit: cover; display: block; }
    .frame-mat h2 { font-size: clamp(23px, 2.8vw, 31px); font-weight: normal; text-align: center; margin: 17px 0 5px; }
    .frame-styling .frame-mat { background: #e5d8ee; }
    .styling-cover { position: relative; display: block; width: 100%; flex: 1; min-height: 0; overflow: hidden; container-type: size; }
    .styling-cover img { position: absolute; left: 50%; top: 50%; width: 100cqh; height: 100cqw; object-fit: cover; transform: translate(-50%, -50%) rotate(90deg); }
    @media (max-width: 850px) { .sections { grid-template-columns: 1fr; max-width: 360px; margin: auto; gap: 45px; } .frame-mat h2 { font-size: 30px; } }
    @media (prefers-reduced-motion: reduce) { .section-frame { transition: none; } }
  </style>
  <link rel="stylesheet" href="/collage-header.css">
</head>
<body>
  <div class="site-loader" role="status" aria-label="Loading Isobel Bartels">
    <div class="site-loader-logo" aria-hidden="true">
      <img src="/images/isobel-bartels-logo.webp" alt="" width="2172" height="724" fetchpriority="high">
    </div>
  </div>

  <a class="collage-header" href="/" aria-label="Isobel Bartels — home">
    <img src="/images/isobel-bartels-logo.webp" alt="Isobel Bartels" width="2172" height="724">
  </a>


  <main>
    <a class="back-link" href="/">← back to the board</a>
    <h1>Creative Portfolio</h1>
    <nav class="sections" aria-label="Creative portfolio sections">
      <a class="section-frame frame-nails" href="/nails/">
        <div class="frame-mat">
          <img src="/images/nails-pink.jpg" alt="Pink mix-and-match nail art" width="1170" height="1483">
          <h2>Nail Art</h2>
        </div>
      </a>
      <a class="section-frame frame-styling" href="/styling/">
        <div class="frame-mat">
          <span class="styling-cover"><img src="/images/styling-mirror.jpg" alt="Solo leopard-print look in the mirror" width="5152" height="3864" loading="lazy"></span>
          <h2>Styling</h2>
        </div>
      </a>
      <a class="section-frame frame-collages" href="/collages/">
        <div class="frame-mat">
          <img src="/images/collage1-thumb.jpg" alt="Handmade paper collage" width="700" height="459">
          <h2>Collages</h2>
        </div>
      </a>
    </nav>
  </main>
</body>
</html>
