<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Corkboard</title>

  <style>
    /* ---- GLOBAL RESET ---- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ---- PAGE BACKGROUND (your image, untouched) ---- */
    body {
      min-height: 100vh;
      background-image: url("images/DSC_7098.jpeg");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px;
      font-family: 'Times New Roman', Times, serif;
    }

    /* ---- PASSWORD SCREEN ---- */
    #login-screen {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    #login-box {
      background: #fdf0c8;
      border-radius: 8px;
      padding: 24px 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      text-align: center;
      border: 2px solid #5c3a1e;
      max-width: 320px;
      width: 90%;
      font-family: 'Times New Roman', Times, serif;
    }

    #login-box h2 {
      font-size: 22px;
      margin-bottom: 10px;
      color: #3a2210;
    }

    #login-box p {
      font-size: 14px;
      margin-bottom: 14px;
      color: #5a3a20;
    }

    #login-box input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      font-size: 15px;
      margin-bottom: 10px;
      border-radius: 4px;
      border: 1px solid #b2966b;
    }

    #login-box button {
      padding: 8px 16px;
      font-size: 15px;
      border-radius: 4px;
      border: none;
      background: #5c3a1e;
      color: #fdf0c8;
      cursor: pointer;
    }

    #login-box button:hover {
      background: #7a4b27;
    }

    #login-error {
      margin-top: 8px;
      font-size: 14px;
      color: #b00020;
      min-height: 18px;
    }

    /* hide the board until password is correct */
    #corkboard-wrapper {
      width: 100%;
      display: none;
      position: relative;
      z-index: 1;
    }

    /* ================= CORKBOARD ================= */

    .corkboard {
      position: relative;
      width: 92%;
      max-width: 1400px;
      min-height: 660px;
      margin: 0 auto;
      padding: 60px 40px 80px;
      border-radius: 6px;
      border: 18px solid #5c3a1e;
      background-color: #c9a173;
      /* tiled at half the file's natural width (1280px), so on a 2x display
         each tile lands at 1:1 device pixels, no upscaling, no blur */
      background-image: url("images/cork.jpg");
      background-repeat: repeat;
      background-size: 640px auto;
      box-shadow:
        inset 0 2px 8px rgba(0,0,0,0.35),
        0 8px 40px rgba(0,0,0,0.6),
        0 2px 6px rgba(0,0,0,0.4);
    }

    /* board frame corner screws */
    .corkboard::after {
      content: '';
      position: absolute;
      inset: -14px;
      border-radius: 6px;
      background:
        radial-gradient(circle 5px at 14px 14px, #3a2210 60%, transparent 61%),
        radial-gradient(circle 5px at calc(100% - 14px) 14px, #3a2210 60%, transparent 61%),
        radial-gradient(circle 5px at 14px calc(100% - 14px), #3a2210 60%, transparent 61%),
        radial-gradient(circle 5px at calc(100% - 14px) calc(100% - 14px), #3a2210 60%, transparent 61%);
      pointer-events: none;
    }

    /* ---- PINNED ITEMS ---- */
    .pinned-item {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: default;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    a.pinned-item {
      cursor: pointer;
      text-decoration: none;
    }

    a.pinned-item:hover {
      filter: brightness(1.08) drop-shadow(0 6px 18px rgba(0,0,0,0.45));
      transform: var(--rotate) scale(1.04) translateY(-4px) !important;
      z-index: 100 !important;
    }

    a.pinned-item .item-img-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 2px;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.18) 50%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    a.pinned-item:hover .item-img-wrap::after {
      opacity: 1;
    }

    .item-img-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-img-wrap img.item-photo {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 2px;
    }

    /* a document pinned to the board reads better with a paper edge */
    .item-img-wrap img.paper {
      background: #fff;
      padding: 4px;
      border-radius: 1px;
      box-shadow: 0 3px 9px rgba(0,0,0,0.35);
    }

    .placeholder-card {
      background: rgba(255,255,255,0.38);
      border: 2px dashed rgba(92,58,30,0.45);
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: rgba(60,38,16,0.8);
      font-family: 'Times New Roman', Times, serif;
      font-size: 13px;
      text-align: center;
      padding: 10px;
    }

    .placeholder-card .ph-icon {
      font-size: 26px;
      opacity: 0.6;
    }

    /* ---- PUSHPIN ---- */
    .pushpin {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff6b6b, #c0392b);
      box-shadow: 0 2px 6px rgba(0,0,0,0.5), inset 0 -1px 3px rgba(0,0,0,0.3);
      z-index: 10;
    }

    /* the needle sinking into the board */
    .pushpin::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 12px;
      background: linear-gradient(to bottom, #888, #555);
      border-radius: 0 0 2px 2px;
      z-index: -1;
    }

    /* ---- TOOLTIP ---- */
    .tooltip {
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.72);
      color: #fff;
      font-family: 'Times New Roman', Times, serif;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 200;
    }

    a.pinned-item:hover .tooltip {
      opacity: 1;
    }

    /* ---- TAPE ---- */
    .tape {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%) rotate(-3deg);
      width: 54px;
      height: 22px;
      background: rgba(255, 240, 150, 0.55);
      border-left: 1px solid rgba(200,180,80,0.3);
      border-right: 1px solid rgba(200,180,80,0.3);
      backdrop-filter: blur(1px);
      z-index: 10;
    }

    /* ---- STICKY NOTE ---- */
    .sticky {
      position: absolute;
      background: #f9e84a;
      padding: 14px 16px 10px;
      font-family: 'Times New Roman', Times, serif;
      font-size: 18px;
      color: #2a2a2a;
      line-height: 1.4;
      box-shadow: 3px 4px 10px rgba(0,0,0,0.3);
      z-index: 5;
    }

    /* ---- PHOTO STRIP ---- */
    .photo-strip {
      position: absolute;
      background: white;
      padding: 6px 6px 22px;
      box-shadow: 2px 4px 12px rgba(0,0,0,0.4);
    }

    .photo-strip .strip-inner {
      width: 110px;
      height: 90px;
      background: #c9bfb3;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 11px;
      font-family: 'Times New Roman', Times, serif;
    }

    .photo-strip p {
      text-align: center;
      font-family: 'Times New Roman', Times, serif;
      font-size: 13px;
      color: #555;
      margin-top: 4px;
    }

    /* ---- NARROW SCREENS / PHONES ----
       The board's items are absolutely positioned by percentage but sized in
       fixed pixels, so below roughly 1150px they start colliding (the scatter
       rotations widen each item's box, which is what makes them touch first).
       Under that, drop out of absolute positioning entirely and let the items
       flow and wrap. !important is needed to beat the per-item inline styles. */
    @media (max-width: 1150px) {
      body {
        padding: 20px 12px;
      }

      .corkboard {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 40px 22px;
        width: 100%;
        min-height: 0;
        padding: 44px 20px 48px;
        border-width: 12px;
      }

      /* max-width matters: the food-diary item has no inline width, so
         without a cap its photo renders at full natural size */
      .corkboard > .pinned-item {
        position: relative;
        top: auto !important;
        right: auto !important;
        bottom: auto !important;
        left: auto !important;
        width: auto !important;
        max-width: 200px;
        transform: none !important;
      }

      /* the scatter rotation would clip against neighbours once items wrap */
      a.pinned-item:hover {
        transform: translateY(-4px) scale(1.03) !important;
      }

      .corkboard > .sticky {
        max-width: 240px;
      }

      /* keep the images from overflowing a phone-width board */
      .item-img-wrap,
      .placeholder-card {
        max-width: 100%;
      }

      .item-img-wrap img.item-photo {
        height: auto;
      }
    }

    @media (max-width: 420px) {
      .corkboard {
        gap: 34px 14px;
        padding: 40px 14px 44px;
        border-width: 10px;
      }

      .corkboard > .pinned-item {
        max-width: 100%;
      }
    }

  </style>
</head>
<body>

  <!-- PASSWORD OVERLAY -->
  <div id="login-screen">
    <div id="login-box">
      <h2>Corkboard is Locked</h2>
      <p>Enter the password to view the corkboard.</p>
      <input type="password" id="password-input" placeholder="Enter password" />
      <button type="button" onclick="checkPassword()">Submit</button>
      <div id="login-error"></div>
    </div>
  </div>

  <!-- CORKBOARD CONTENT -->
  <div id="corkboard-wrapper">
    <div class="corkboard">

      <!-- sticky note: top left -->
      <div class="sticky pinned-item" style="--rotate: rotate(2deg); transform: rotate(2deg); top: 45px; left: 4%; z-index: 4; width: 148px;">
        <div class="tape"></div>
        Escaping Allows You To Hear Yourself
      </div>

      <!-- sticky note: top right -->
      <div class="sticky pinned-item" style="--rotate: rotate(-4deg); transform: rotate(-4deg); top: 55px; right: 6%; width: 128px; background: #b8f0b0; z-index: 3; font-size: 15px;">
        <div class="tape" style="transform: translateX(-50%) rotate(5deg);"></div>
        updated weekly 🌿
      </div>

      <!-- NAV ITEM 1: ART -->
      <a class="pinned-item" href="art.html"
         style="--rotate: rotate(-7deg); transform: rotate(-7deg); top: 190px; left: 5%; z-index: 6; width: 150px;">
        <div class="pushpin"></div>
        <div class="item-img-wrap" style="width:150px; height:150px;">
          <img src="images/flowers.png" alt="Flowers" class="item-photo" style="display:block; max-width:100%; height:auto; border-radius:3px;">
        </div>
        <span class="tooltip">art</span>
      </a>

      <!-- NAV ITEM 2: RESUME / WORK -->
      <a class="pinned-item" href="work.html"
         style="--rotate: rotate(5deg); transform: rotate(5deg); top: 175px; left: 23%; z-index: 7; width: 145px;">
        <div class="pushpin"></div>
        <div class="item-img-wrap" style="width:145px; height:188px;">
          <img src="images/resume-thumb.png" alt="Resume" class="item-photo paper" style="display:block; width:100%; height:auto;">
        </div>
        <span class="tooltip">resume / work</span>
      </a>

      <!-- DECORATIVE PHOTO: upper middle -->
      <div class="pinned-item"
           style="--rotate: rotate(8deg); transform: rotate(8deg); top: 200px; left: 43%; z-index: 5; width: 135px;">
        <div class="pushpin"></div>
        <div class="item-img-wrap" style="width:135px; height:135px;">
          <div class="placeholder-card" style="width:135px; height:135px;">
            <span class="ph-icon">📷</span>
            <span>your-photo.png</span>
          </div>
        </div>
      </div>

      <!-- photo strip: upper right -->
      <div class="photo-strip pinned-item" style="--rotate: rotate(-5deg); transform: rotate(-5deg); top: 185px; left: 61%; z-index: 2;">
        <div class="pushpin"></div>
        <div class="strip-inner">[ photo ]</div>
        <p>summer '24</p>
      </div>

      <!-- NAV ITEM 3: FOOD DIARY -->
      <a class="pinned-item" href="food.html"
         style="--rotate: rotate(-3deg); transform: rotate(-3deg); top: 420px; left: 13%; z-index: 6; width: 145px;">
        <div class="pushpin"></div>
        <div class="item-img-wrap">
          <img src="images/sweetpotato.png" alt="Sweet potato dish" class="item-photo" style="display:block; max-width:100%; height:auto; border-radius:3px;">
        </div>
        <span class="tooltip">food diary</span>
      </a>

      <!-- DECORATIVE PHOTO 2: lower right -->
      <div class="pinned-item"
           style="--rotate: rotate(-6deg); transform: rotate(-6deg); top: 390px; right: 8%; z-index: 5; width: 125px;">
        <div class="pushpin"></div>
        <div class="item-img-wrap" style="width:125px; height:125px;">
          <div class="placeholder-card" style="width:125px; height:125px;">
            <span class="ph-icon">📷</span>
            <span>your-photo.png</span>
          </div>
        </div>
      </div>

    </div><!-- /.corkboard -->
  </div><!-- /#corkboard-wrapper -->

  <script>
    // change this to whatever password you want
    const CORRECT_PASSWORD = "letmein";

    function checkPassword() {
      const entered = document.getElementById("password-input").value;
      const error = document.getElementById("login-error");

      if (entered === CORRECT_PASSWORD) {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("corkboard-wrapper").style.display = "block";
      } else {
        error.textContent = "Wrong password.";
      }
    }
  </script>

</body>
</html>
