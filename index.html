<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Corkboard</title>

  <style>
    /* ---- GLOBAL RESET ---- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ---- PAGE ---- */
    body {
      min-height: 100vh;
      background: #c9a173;
      font-family: 'Times New Roman', Times, serif;
    }

    /* ---- PASSWORD SCREEN ---- */
    #login-screen {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    #login-box {
      background: #fdf0c8;
      border-radius: 8px;
      padding: 24px 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      text-align: center;
      border: 2px solid #5c3a1e;
      max-width: 320px;
      width: 90%;
      font-family: 'Times New Roman', Times, serif;
    }

    #login-box h2 {
      font-size: 22px;
      margin-bottom: 10px;
      color: #3a2210;
    }

    #login-box p {
      font-size: 14px;
      margin-bottom: 14px;
      color: #5a3a20;
    }

    #login-box input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      font-size: 15px;
      margin-bottom: 10px;
      border-radius: 4px;
      border: 1px solid #b2966b;
    }

    #login-box button {
      padding: 8px 16px;
      font-size: 15px;
      border-radius: 4px;
      border: none;
      background: #5c3a1e;
      color: #fdf0c8;
      cursor: pointer;
    }

    #login-box button:hover {
      background: #7a4b27;
    }

    #login-error {
      margin-top: 8px;
      font-size: 14px;
      color: #b00020;
      min-height: 18px;
    }

    /* The board opens directly for every visitor. */
    #corkboard-wrapper {
      width: 100%;
      display: block;
      position: relative;
      z-index: 1;
    }

    /* ================= CORKBOARD ================= */

    .corkboard {
      position: relative;
      width: 100%;
      max-width: none;
      min-height: 100vh;
      margin: 0;
      padding: 60px 40px 80px;
      background-color: #c9a173;
      /* A seamless version of the original cork texture prevents tile lines. */
      background-image: url("images/cork-seamless.png");
      background-repeat: repeat;
      background-size: 640px auto;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.35);
    }

    /* The approved collage is shown in two cropped windows, preserving its paper edges. */
    .board-name {
      position: absolute;
      top: 26px;
      left: 28px;
      width: 310px;
      height: 205px;
      transform: scale(1.25);
      transform-origin: top left;
      z-index: 8;
      pointer-events: none;
    }

    .board-name span {
      display: block;
      background-image: url("images/isobel-bartels-cutout.png");
      background-repeat: no-repeat;
      background-size: 500px auto;
    }

    .board-name-first {
      width: 234px;
      height: 105px;
      background-position: 0 -27px;
      transform: rotate(-5deg);
    }

    .board-name-last {
      width: 265px;
      height: 108px;
      margin-top: -6px;
      margin-left: 43px;
      background-position: -235px -27px;
      transform: rotate(3deg);
    }

    /* ---- PINNED ITEMS ---- */
    .pinned-item {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: default;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    a.pinned-item {
      cursor: pointer;
      text-decoration: none;
    }

    a.pinned-item:hover {
      filter: brightness(1.08) drop-shadow(0 6px 18px rgba(0,0,0,0.45));
      transform: var(--rotate) scale(1.04) translateY(-4px) !important;
      z-index: 100 !important;
    }

    a.pinned-item .item-img-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 2px;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.18) 50%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    a.pinned-item:hover .item-img-wrap::after {
      opacity: 1;
    }

    .item-img-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-img-wrap img.item-photo {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 2px;
    }

    /* a document pinned to the board reads better with a paper edge */
    .item-img-wrap img.paper {
      background: #fff;
      padding: 4px;
      border-radius: 1px;
      box-shadow: 0 3px 9px rgba(0,0,0,0.35);
    }


    /* ---- PUSHPIN ---- */
    .pushpin {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff6b6b, #c0392b);
      box-shadow: 0 2px 6px rgba(0,0,0,0.5), inset 0 -1px 3px rgba(0,0,0,0.3);
      z-index: 10;
    }

    /* the needle sinking into the board */
    .pushpin::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 12px;
      background: linear-gradient(to bottom, #888, #555);
      border-radius: 0 0 2px 2px;
      z-index: -1;
    }

    /* ---- TOOLTIP ---- */
    .tooltip {
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.72);
      color: #fff;
      font-family: 'Times New Roman', Times, serif;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 200;
    }

    a.pinned-item:hover .tooltip {
      opacity: 1;
    }

    /* ---- TAPE ---- */
    .tape {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%) rotate(-3deg);
      width: 54px;
      height: 22px;
      background: rgba(255, 240, 150, 0.55);
      border-left: 1px solid rgba(200,180,80,0.3);
      border-right: 1px solid rgba(200,180,80,0.3);
      backdrop-filter: blur(1px);
      z-index: 10;
    }

    /* ---- STICKY NOTE ---- */
    .sticky {
      position: absolute;
      background: #f9e84a;
      padding: 14px 16px 10px;
      font-family: 'Times New Roman', Times, serif;
      font-size: 18px;
      color: #2a2a2a;
      line-height: 1.4;
      box-shadow: 3px 4px 10px rgba(0,0,0,0.3);
      z-index: 5;
    }

    .graduation-note {
      top: 80px;
      left: 43%;
      width: 215px;
      padding: 24px 16px 18px;
      background: #d1d490;
      text-align: center;
      transform: rotate(6deg);
    }

    .graduation-note h2 { font-size: 19px; font-weight: normal; }
    .graduation-note strong { display: block; font-size: 42px; line-height: 1.15; margin-top: 10px; }
    .graduation-note time { display: block; margin-top: 12px; font-size: 14px; }

    @media (max-width: 1150px) {
      .graduation-note { top: 350px; left: auto; right: 9%; }
    }

    @media (max-width: 650px) {
      .corkboard:has(.graduation-note) { min-height: max(100vh, 1200px); }
      .graduation-note { top: 940px; left: 12%; right: auto; }
    }

    .visitor-sticky {
      width: 170px;
      min-height: 110px;
      box-sizing: border-box;
      background: var(--sticky-color, #f9e84a);
      cursor: default;
      overflow-wrap: anywhere;
    }

    .delete-note {
      position: absolute;
      top: 5px;
      right: 6px;
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 50%;
      background: rgba(82, 50, 20, 0.78);
      color: #fff;
      cursor: pointer;
      font: bold 17px/20px Arial, sans-serif;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .visitor-sticky:hover .delete-note,
    .delete-note:focus-visible {
      opacity: 1;
    }

    .visitor-sticky::before {
      content: '';
      position: absolute;
      top: -9px;
      left: 50%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle at 35% 35%, #ff6b6b, #c0392b);
      box-shadow: 0 2px 5px rgba(0,0,0,0.45);
    }

    #note-dialog {
      position: fixed;
      inset: 0;
      margin: auto;
      border: 0;
      border-radius: 4px;
      padding: 0;
      background: #f9e84a;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      font-family: 'Times New Roman', Times, serif;
    }

    #note-dialog::backdrop {
      background: rgba(0,0,0,0.35);
    }

    #note-form,
    #delete-note-form {
      width: min(320px, calc(100vw - 48px));
      padding: 22px;
    }

    #note-form label,
    #note-form textarea,
    #delete-note-form label,
    #delete-note-form input {
      display: block;
      width: 100%;
    }

    #note-form textarea {
      box-sizing: border-box;
      min-height: 100px;
      margin-top: 8px;
      padding: 8px;
      resize: vertical;
      font: inherit;
    }

    #delete-note-form input {
      box-sizing: border-box;
      margin-top: 8px;
      padding: 8px;
      font: inherit;
    }

    #delete-note-error {
      min-height: 18px;
      margin-top: 8px;
      color: #8b0000;
    }

    .note-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    .portfolio-pin {
      top: 580px;
      left: 36%;
      width: 180px;
      --rotate: rotate(7deg);
      transform: var(--rotate);
    }
    .portfolio-pin > .pushpin {
      top: 26px;
      left: 23%;
    }

    .corkboard { min-height: max(100vh, 800px); }

    /* Keep the hand-pinned scatter at every screen width. */
    @media (max-width: 1150px) {
      .corkboard {
        min-height: max(100vh, 780px);
      }
      .corkboard > a[href="art.html"] {
        top: 150px !important;
        left: auto !important;
        right: 8%;
      }
      .corkboard > a[href="work.html"] {
        top: 380px !important;
        left: 14% !important;
      }
      .corkboard > a[href="food.html"] {
        top: 540px !important;
        left: auto !important;
        right: 19%;
      }
    }

    @media (max-width: 650px) {
      .corkboard:has(.portfolio-pin) { min-height: max(100vh, 1450px); }
      .portfolio-pin { top: 1220px; left: auto; right: 12%; }
      .corkboard {
        min-height: max(100vh, 930px);
      }
      .corkboard > a[href="art.html"] {
        top: 280px !important;
        right: 10%;
      }
      .corkboard > a[href="work.html"] {
        top: 495px !important;
        left: 9% !important;
      }
      .corkboard > a[href="food.html"] {
        top: 760px !important;
        right: 14%;
      }
    }

    @media (max-width: 420px) {
      .board-name {
        left: 14px;
        transform: scale(1.03);
        transform-origin: top left;
      }

    }

    .publications-pin {
      top: 600px;
      right: 9%;
      width: 190px;
      padding: 24px 14px 18px;
      background: #fffdf0;
      color: #2a2118;
      box-shadow: 3px 5px 12px #0004;
      --rotate: rotate(-6deg);
      transform: var(--rotate);
    }
    .publications-pin .publication-title {
      width: 100%;
      padding-bottom: 8px;
      border-bottom: 3px double #2a2118;
      text-align: center;
      font-size: 23px;
    }
    .publication-columns {
      width: 100%;
      height: 62px;
      margin-top: 10px;
      background: repeating-linear-gradient(to bottom, #6f6252 0 1px, transparent 1px 7px);
      position: relative;
      opacity: .6;
    }
    .publication-columns::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 48%;
      width: 8px;
      background: #fffdf0;
    }
    .publications-pin:focus-visible { outline: 2px dashed #3a2210; outline-offset: 6px; }
    @media (min-width: 651px) and (max-width: 1150px) {
      .corkboard { min-height: max(100vh, 1000px); }
      .publications-pin { top: 800px; right: 12%; }
    }
    @media (max-width: 650px) {
      .corkboard:has(.publications-pin) { min-height: max(100vh, 1680px); }
      .publications-pin { top: 1460px; left: 12%; right: auto; }
    }

    /* Larger pieces follow the proportions of the full corkboard reference. */
    @media (min-width: 1151px) {
      .corkboard { min-height: max(100vh, 66vw); }
      .board-name { top: 24px; left: 3%; transform: scale(1.5); }
      .graduation-note {
        top: 5vw; left: 42%; width: 22vw;
        padding: 2.2vw 1vw;
      }
      .graduation-note h2 { font-size: 1.9vw; }
      .graduation-note strong { font-size: 5.5vw; }
      #graduation-label { font-size: 2vw; }
      .corkboard > a[href="art.html"] {
        top: 4vw !important; left: 71% !important; width: 24vw !important;
      }
      .corkboard > a[href="work.html"] {
        top: max(29vw, 440px) !important; left: 8% !important; width: 24vw !important;
      }
      .corkboard > a[href="food.html"] {
        top: 29vw !important; left: 47% !important; width: 23vw !important;
      }
      .portfolio-pin { top: 45vw; left: 37%; width: 16vw; }
      .portfolio-pin > .pushpin { top: 2.3vw; }
      .publications-pin { top: 42vw; right: 5%; width: 20vw; padding: 2vw 1.2vw 1.5vw; }
      .publications-pin .publication-title { font-size: 2.4vw; }
      .publication-columns { height: 6vw; }
      .pushpin { width: 26px; height: 26px; }
    }
    @media (min-width: 1400px) {
      .board-name { transform: scale(1.8); }
      .corkboard > a[href="work.html"] { top: max(29vw, 500px) !important; }
    }
    @media (min-width: 1650px) {
      .board-name { transform: scale(2); }
      .corkboard > a[href="work.html"] { top: max(29vw, 550px) !important; }
    }
    .corkboard > a[href="art.html"] .item-img-wrap,
    .corkboard > a[href="work.html"] .item-img-wrap {
      width: 100% !important;
      height: auto !important;
    }
    @media (max-width: 1150px) {
      .corkboard > a[href="art.html"],
      .corkboard > a[href="work.html"],
      .corkboard > a[href="food.html"] { width: 220px !important; }
      .portfolio-pin { width: 210px; }
      .publications-pin { width: 220px; }
    }
    @media (max-width: 650px) {
      .corkboard > a[href="work.html"] { top: 650px !important; }
      .corkboard > a[href="food.html"] { top: 1010px !important; }
      .graduation-note { top: 1260px; }
      .portfolio-pin { top: 1510px; }
      .publications-pin { top: 1790px; }
      .corkboard:has(.publications-pin) { min-height: max(100vh, 2020px); }
    }

    /* Stagger the paper landing, then press each pin into the board. */
    @media (prefers-reduced-motion: no-preference) {
      .board-name,
      .corkboard > .pinned-item,
      .corkboard > .sticky {
        animation: pin-paper-in 600ms cubic-bezier(.22, .75, .3, 1) both;
        animation-delay: var(--pin-delay, 0ms);
      }

      .board-name { --pin-delay: 80ms; }
      .corkboard > a[href="work.html"] { --pin-delay: 300ms; }
      .corkboard > a[href="art.html"] { --pin-delay: 520ms; }
      .graduation-note { --pin-delay: 740ms; }
      .corkboard > a[href="food.html"] { --pin-delay: 960ms; }
      .portfolio-pin { --pin-delay: 1180ms; }
      .publications-pin { --pin-delay: 1400ms; }
      .visitor-sticky { --pin-delay: 1620ms; }

      .corkboard > .pinned-item > .pushpin,
      .graduation-note > .tape,
      .visitor-sticky::before {
        animation: press-pin-in 300ms ease-out both;
        animation-delay: calc(var(--pin-delay, 0ms) + 360ms);
      }

      @keyframes pin-paper-in {
        from { opacity: 0; translate: 0 -28px; scale: 1.08; rotate: -4deg; }
        65% { opacity: 1; translate: 0 3px; scale: .99; rotate: 1deg; }
        to { opacity: 1; translate: 0 0; scale: 1; rotate: 0deg; }
      }

      @keyframes press-pin-in {
        from { opacity: 0; translate: 0 -16px; scale: 1.5; }
        70% { opacity: 1; translate: 0 2px; scale: .9; }
        to { opacity: 1; translate: 0 0; scale: 1; }
      }
    }

  </style>
</head>
<body>

  <!-- CORKBOARD CONTENT -->
  <div id="corkboard-wrapper">
    <div class="corkboard">

      <h1 class="board-name" aria-label="Isobel Bartels">
        <span class="board-name-first" aria-hidden="true"></span>
        <span class="board-name-last" aria-hidden="true"></span>
      </h1>

      <aside class="sticky graduation-note" aria-label="College graduation countdown">
        <div class="tape" aria-hidden="true"></div>
        <h2>college graduation!</h2>
        <p><strong id="graduation-days">…</strong><span id="graduation-label">days</span></p>
      </aside>

      <!-- Positions are deliberately uneven: no two items share a top edge and
           every rotation differs, so the board reads as pinned by hand rather
           than laid out on a grid. -->

      <!-- NAV ITEM 1: ART -->
      <a class="pinned-item" href="art.html"
         style="--rotate: rotate(11deg); transform: rotate(11deg); top: 115px; left: 72%; z-index: 6; width: 174px;">
        <div class="pushpin"></div>
        <div class="item-img-wrap" style="width:174px;">
          <img src="images/good-reminder.png" alt="Good Reminder paper collage" class="item-photo" style="display:block; max-width:100%; height:auto; border-radius:3px;">
        </div>
        <span class="tooltip">art</span>
      </a>

      <!-- NAV ITEM 2: PROFESSIONAL EXPERIENCE -->
      <a class="pinned-item" href="work.html"
         style="--rotate: rotate(-8deg); transform: rotate(-8deg); top: 310px; left: 21%; z-index: 7; width: 174px;">
        <div class="pushpin"></div>
        <div class="item-img-wrap" style="width:174px; height:226px;">
          <img src="images/resume-thumb.png" alt="Resume" class="item-photo paper" style="display:block; width:100%; height:auto;">
        </div>
        <span class="tooltip">professional experience</span>
      </a>

      <!-- NAV ITEM 3: FOOD DIARY -->
      <a class="pinned-item" href="food.html"
         style="--rotate: rotate(-4deg); transform: rotate(-4deg); top: 405px; left: 56%; z-index: 6; width: 174px;">
        <div class="pushpin"></div>
        <div class="item-img-wrap">
          <img src="images/food-bowl.png" alt="Curry bowl with a gold spoon" class="item-photo" style="display:block; max-width:100%; height:auto; border-radius:3px;">
        </div>
        <span class="tooltip">food diary</span>
      </a>

      <a class="pinned-item portfolio-pin" href="projects.html">
        <span class="pushpin" aria-hidden="true"></span>
        <div class="item-img-wrap">
          <img src="images/project-portfolio.png" alt="Project portfolio" class="item-photo">
        </div>
        <span class="tooltip">project portfolio</span>
      </a>

      <a class="pinned-item publications-pin" href="publications.html">
        <span class="pushpin" aria-hidden="true"></span>
        <span class="publication-title">publications</span>
        <span class="publication-columns" aria-hidden="true"></span>
      </a>

    </div><!-- /.corkboard -->
  </div><!-- /#corkboard-wrapper -->

  <dialog id="note-dialog" aria-labelledby="note-dialog-title">
    <form id="note-form" method="dialog">
      <label id="note-dialog-title" for="note-text">Leave me a note</label>
      <textarea id="note-text" maxlength="280" required placeholder="Write your post-it note..."></textarea>
      <div class="note-actions">
        <button type="button" id="cancel-note">Cancel</button>
        <button type="submit">Pin note</button>
      </div>
    </form>
  </dialog>

  <dialog id="delete-note-dialog" aria-labelledby="delete-note-dialog-title">
    <form id="delete-note-form" method="dialog">
      <label id="delete-note-dialog-title" for="delete-note-password">Enter the corkboard password to delete this note</label>
      <input id="delete-note-password" type="password" required autocomplete="current-password">
      <div id="delete-note-error" role="alert"></div>
      <div class="note-actions">
        <button type="button" id="cancel-delete-note">Cancel</button>
        <button type="submit">Delete note</button>
      </div>
    </form>
  </dialog>

  <script>
    function updateGraduationCountdown() {
      const now = new Date();
      // Count calendar days, avoiding daylight-saving shifts and fractional days.
      const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      const days = Math.round((Date.UTC(2027, 4, 15) - today) / 86400000);
      document.getElementById('graduation-days').textContent = days > 0 ? days : '🎓';
      document.getElementById('graduation-label').textContent = days > 0
        ? (days === 1 ? 'day' : 'days')
        : (days === 0 ? 'graduation day!' : 'officially graduated!');
    }
    updateGraduationCountdown();
    setInterval(updateGraduationCountdown, 60000);
    document.addEventListener('visibilitychange', updateGraduationCountdown);

    // change this to whatever password you want
    const CORRECT_PASSWORD = "letmein";

    const board = document.querySelector('.corkboard');
    const noteDialog = document.getElementById('note-dialog');
    const noteForm = document.getElementById('note-form');
    const noteText = document.getElementById('note-text');
    const noteStorageKey = 'corkboard-visitor-notes';
    const stickyColors = ['#b2a5ee', '#664fc9', '#eba2dd', '#db4d4f', '#d1d490', '#a3d6f0'];
    let pendingNotePosition;
    let pendingDeleteNoteId;

    function addNote(note) {
      const sticky = document.createElement('div');
      sticky.className = 'sticky visitor-sticky';
      sticky.dataset.noteId = note.id;
      sticky.textContent = note.text;
      sticky.style.setProperty('--sticky-color', note.color);
      sticky.style.left = `${note.left}%`;
      sticky.style.top = `${note.top}%`;
      sticky.style.transform = `rotate(${note.rotation}deg)`;
      sticky.style.zIndex = 20;
      const deleteButton = document.createElement('button');
      deleteButton.className = 'delete-note';
      deleteButton.type = 'button';
      deleteButton.setAttribute('aria-label', 'Delete this note');
      deleteButton.textContent = '×';
      deleteButton.addEventListener('click', (event) => {
        event.stopPropagation();
        pendingDeleteNoteId = note.id;
        document.getElementById('delete-note-password').value = '';
        document.getElementById('delete-note-error').textContent = '';
        document.getElementById('delete-note-dialog').showModal();
        document.getElementById('delete-note-password').focus();
      });
      sticky.appendChild(deleteButton);
      board.appendChild(sticky);
    }

    function savedNotes() {
      try {
        return JSON.parse(localStorage.getItem(noteStorageKey)) || [];
      } catch {
        return [];
      }
    }

    const storedNotes = savedNotes();
    const existingNotes = storedNotes.map((note, index) => ({
      ...note,
      id: note.id || `${Date.now()}-${Math.random().toString(16).slice(2)}`,
      color: note.color || stickyColors[index % stickyColors.length]
    }));
    if (existingNotes.some((note, index) => note.id !== storedNotes[index].id || note.color !== storedNotes[index].color)) {
      try {
        localStorage.setItem(noteStorageKey, JSON.stringify(existingNotes));
      } catch {
        // Existing notes remain usable for this visit if storage is unavailable.
      }
    }
    existingNotes.forEach(addNote);

    document.getElementById('cancel-note').addEventListener('click', () => noteDialog.close());

    noteForm.addEventListener('submit', () => {
      const text = noteText.value.trim();
      if (!text || !pendingNotePosition) return;
      const note = {
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        text,
        ...pendingNotePosition,
        color: stickyColors[savedNotes().length % stickyColors.length],
        rotation: Math.round((Math.random() * 10 - 5) * 10) / 10
      };
      const notes = savedNotes();
      notes.push(note);
      try {
        localStorage.setItem(noteStorageKey, JSON.stringify(notes));
      } catch {
        // The note still appears for this visit if storage is unavailable.
      }
      addNote(note);
    });

    document.getElementById('cancel-delete-note').addEventListener('click', () => {
      document.getElementById('delete-note-dialog').close();
    });

    document.getElementById('delete-note-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const password = document.getElementById('delete-note-password').value;
      const error = document.getElementById('delete-note-error');
      if (password !== CORRECT_PASSWORD) {
        error.textContent = 'Wrong password.';
        return;
      }
      const remainingNotes = savedNotes().filter((note) => note.id !== pendingDeleteNoteId);
      try {
        localStorage.setItem(noteStorageKey, JSON.stringify(remainingNotes));
      } catch {
        // The note is still removed for this visit if storage is unavailable.
      }
      document.querySelector(`[data-note-id="${pendingDeleteNoteId}"]`)?.remove();
      document.getElementById('delete-note-dialog').close();
    });
  </script>

</body>
</html>
