<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preload" as="image" href="/images/cork-seamless.webp" fetchpriority="high">
  <link rel="stylesheet" href="/loading.css">
  <link rel="preload" as="image" href="/images/isobel-bartels-logo.webp" fetchpriority="high">
  <script src="/loading-logo.js" defer></script>
  <script src="/cork-background.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Handmade paper collages by Isobel Bartels.">
  <meta property="og:description" content="Handmade paper collages by Isobel Bartels.">
  <meta property="og:url" content="https://isobelbartels.com/collages/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://isobelbartels.com/images/isobel-bartels-cutout.png">
  <meta property="og:image:alt" content="Isobel Bartels collage logo">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:description" content="Handmade paper collages by Isobel Bartels.">
  <meta name="twitter:image" content="https://isobelbartels.com/images/isobel-bartels-cutout.png">
  <meta name="theme-color" content="#e5dcf5">
  <title>Isobel Bartels</title>
  <link rel="canonical" href="https://isobelbartels.com/collages/">
  <meta property="og:title" content="Isobel Bartels">
  <meta property="og:site_name" content="Isobel Bartels">
  <meta name="twitter:title" content="Isobel Bartels">
  <meta name="application-name" content="Isobel Bartels">
  <meta name="apple-mobile-web-app-title" content="Isobel Bartels">
  <meta name="robots" content="max-image-preview:large">

  <style>

    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 24px 72px; min-height: 100vh; font-family: 'Times New Roman', Times, serif; color: #35271f; background: #c9a173 var(--cork-texture, url('/images/cork-seamless.webp')) repeat; background-size: 640px auto; }
    main { max-width: 1100px; margin: auto; }
    .back-link { color: #fffaf0; text-shadow: 0 1px 4px #000b; font-size: 15px; }
    h1 { color: #fffaf0; text-shadow: 0 2px 7px #0008; text-align: center; font-size: clamp(32px, 5vw, 44px); font-weight: normal; margin: 30px 0 52px; }
    a:focus-visible, button:focus-visible { outline: 3px solid #633650; outline-offset: 8px; }
    @media (max-width: 550px) { body { padding: 20px 24px 50px; } }

    .pieces { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 38px; max-width: 880px; margin: auto; align-items: start; }
    .piece { display: block; background: #fffaf0; padding: 15px; color: inherit; text-decoration: none; box-shadow: 0 8px 16px #35210b66; transform: rotate(-1deg); transition: transform .18s ease; }
    .piece:nth-child(even) { transform: rotate(1deg); }
    .piece:hover { transform: translateY(-4px); }
    figure { margin: 0; }
    .piece img { width: 100%; height: auto; display: block; }
    figcaption { text-align: center; padding: 15px 0 2px; font-size: 16px; }
    .medium { display: block; font-size: 13px; font-style: italic; color: #766453; margin-top: 4px; }
    dialog { border: 0; padding: 44px 16px 16px; background: #fffaf0; max-width: 94vw; max-height: 94vh; }
    dialog::backdrop { background: #140e08eb; }
    dialog img { display: block; margin: auto; max-width: 85vw; max-height: 72vh; object-fit: contain; }
    dialog p { text-align: center; margin: 14px 0 2px; }
    dialog button { position: absolute; right: 10px; top: 5px; border: 0; background: none; font-size: 28px; cursor: pointer; }
    @media (max-width: 550px) { .pieces { grid-template-columns: 1fr; gap: 32px; } }
    @media (prefers-reduced-motion: reduce) { .piece { transition: none; } }
  </style>
  <link rel="stylesheet" href="/collage-header.css">
</head>
<body>
  <div class="site-loader" role="status" aria-label="Loading Isobel Bartels">
    <div class="site-loader-logo" aria-hidden="true">
      <img src="/images/isobel-bartels-logo.webp" alt="" width="2172" height="724" fetchpriority="high">
    </div>
  </div>

  <a class="collage-header" href="/" aria-label="Isobel Bartels — home">
    <img src="/images/isobel-bartels-logo.webp" alt="Isobel Bartels" width="2172" height="724">
  </a>

  <main>
    <a class="back-link" href="/art/">← back to creative portfolio</a>
    <h1>Collages</h1>
    <div class="pieces">
        <a class="piece" href="/images/collage1-web.jpg" data-title="Purse Scraps &amp; Random Thoughts"><figure>
        <img src="/images/collage1-thumb.jpg" alt="Dense mixed-media collage of magazine and newspaper clippings, centered on the torn phrase &quot;what is meant for you cannot miss you&quot;" loading="lazy" width="700" height="459">
        <figcaption>
          Purse Scraps &amp; Random Thoughts
          <span class="medium">paper collage on board</span>
        </figcaption>
      </figure></a>
        <a class="piece" href="/images/collage2-web.jpg" data-title="Good Reminder"><figure>
        <img src="/images/collage2-thumb.jpg" alt="Collage of torn landscape photographs with cut-out ransom-note lettering reading &quot;oldest you've been and the youngest you'll be ever again&quot;" loading="lazy" width="533" height="700">
        <figcaption>
          Good Reminder
          <span class="medium">paper collage on board</span>
        </figcaption>
      </figure></a>
        <a class="piece" href="/images/for-harper-web.jpg" data-title="For Harper"><figure>
        <img src="/images/for-harper-thumb.jpg" alt="Birthday collage for Harper with pink leopard print, a yellow flower, butterflies, and pink paper hearts" loading="lazy" width="765" height="840">
        <figcaption>
          For Harper
          <span class="medium">paper collage on board</span>
        </figcaption>
      </figure></a>
        <a class="piece" href="/images/untitled-collage-web.jpg" data-title="Untitled"><figure>
        <img src="/images/untitled-collage-thumb.jpg" alt="Paper collage with red hearts, vintage cars, receipts, magazine clippings, and handwritten notes" loading="lazy" width="840" height="605">
        <figcaption>
          Untitled
          <span class="medium">paper collage on board</span>
        </figcaption>
      </figure></a>
    </div>
  </main>
  <dialog aria-label="Enlarged artwork">
    <button type="button" aria-label="Close artwork">×</button>
    <img alt="">
    <p></p>
  </dialog>
  <script>
    const viewer = document.querySelector('dialog');
    const enlarged = viewer.querySelector('img');
    const caption = viewer.querySelector('p');
    document.querySelectorAll('a.piece').forEach(piece => {
      piece.addEventListener('click', event => {
        if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        enlarged.src = piece.href;
        enlarged.alt = piece.querySelector('img').alt;
        caption.textContent = piece.dataset.title;
        viewer.showModal();
        document.body.style.overflow = 'hidden';
      });
    });
    viewer.querySelector('button').addEventListener('click', () => viewer.close());
    viewer.addEventListener('click', event => {
      if (event.target === viewer) {
        const bounds = viewer.getBoundingClientRect();
        if (event.clientX < bounds.left || event.clientX > bounds.right ||
            event.clientY < bounds.top || event.clientY > bounds.bottom) viewer.close();
      }
    });
    viewer.addEventListener('close', () => {
      enlarged.removeAttribute('src');
      document.body.style.overflow = '';
    });
  </script>
</body>
</html>
